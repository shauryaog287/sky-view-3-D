name: Deploy

# Manual deploy to Cloudflare (Workers API + Pages frontend). Never runs on its own.
# Required repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Required repository variables: VITE_API_BASE (Worker URL), and optionally VITE_SUPABASE_URL,
# VITE_SUPABASE_ANON_KEY, VITE_CESIUM_ION_TOKEN, VITE_ANALYTICS.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [both, api, web]
        default: both

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Apply D1 migrations
        if: inputs.target != 'web'
        run: npx wrangler d1 migrations apply skyview --remote --config worker/wrangler.toml
      - name: Deploy Worker API
        if: inputs.target != 'web'
        run: npx wrangler deploy --config worker/wrangler.toml
      - name: Build frontend
        if: inputs.target != 'api'
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_CESIUM_ION_TOKEN: ${{ vars.VITE_CESIUM_ION_TOKEN }}
          VITE_ANALYTICS: ${{ vars.VITE_ANALYTICS || 'self' }}
          VITE_LAUNCH_MODE: open
        run: npx vite build
      - name: Deploy Pages
        if: inputs.target != 'api'
        run: npx wrangler pages deploy dist --project-name skyview-3d --branch main
